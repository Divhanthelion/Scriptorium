# The Spanish Free Bible Version
follows = "fbv"
# Psalm 43's "title" is an editor's note: "Psalms 42 and 43 were originally one"
# Philippians 1:16-17 in the critical text's order: its 1:16 ("por amor"; the FBV's own table misses this) is the KJV's 1:17
counterparts = { "PSA 43:0" = "-", "PHP 1:16" = "PHP 1:17", "PHP 1:17" = "PHP 1:16" }

