# Its text is divided as the Hebrew in places, with empty verses keeping the KJV's numbers
# (1 Samuel 23:29 is empty and 24:1 is the KJV's 23:29): those books are compared by
# content with La Biblia en Español Sencillo, numbered and divided as the KJV
compared_with = "bes"

