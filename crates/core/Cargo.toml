[package]
name = "kjv-core"
version = "0.1.0"
edition = "2024"
license = "MIT-0"
description = "Scriptorium's core: the KJV and its Hebrew and Greek, search, parallel reading, and the assistant's context"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
kjv-library = { path = "../library" }

[dev-dependencies]
kjv-library = { path = "../library", features = ["build"] }
sha2 = "0.10"
zstd = "0.13"
